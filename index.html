.term { font-size:var(--term-font-size,13px);font-weight:var(--term-font-weight,400); }

.term-body { position:relative;z-index:1; }
.pattern-dots::before { background-image:radial-gradient(var(--t-pattern) .65px,transparent .75px);background-size:13px 13px; }
.pattern-grid::before { background-image:linear-gradient(var(--t-pattern) .6px,transparent .6px),linear-gradient(90deg,var(--t-pattern) .6px,transparent .6px);background-size:24px 24px; }
.pattern-diagonal::before { background-image:repeating-linear-gradient(135deg,transparent 0 12px,var(--t-pattern) 12px 12.7px); }
.pattern-cross::before { background-image:linear-gradient(var(--t-pattern) .7px,transparent .7px),linear-gradient(90deg,var(--t-pattern) .7px,transparent .7px);background-size:32px 32px;background-position:16px 16px; }
.pattern-waves::before { background-image:radial-gradient(ellipse at center,transparent 64%,var(--t-pattern) 66%,transparent 68%);background-size:30px 12px; }
.pattern-bricks::before { background-image:linear-gradient(var(--t-pattern) .7px,transparent .7px),linear-gradient(90deg,var(--t-pattern) .7px,transparent .7px);background-size:28px 14px;background-position:0 0,14px 7px; }
.pattern-choices { display:grid;grid-template-columns:repeat(4,1fr);gap:6px; }
.pattern-chip { height:46px;border-radius:7px;background:var(--ui-field);box-shadow:inset 0 0 0 1px var(--ui-edge);position:relative;overflow:hidden;color:var(--ui-muted); }
.pattern-chip::before { content:"";position:absolute;inset:0;opacity:1;background-color:var(--ui-field); }
.pattern-chip.pattern-dots::before { background-image:radial-gradient(var(--ui-edge) .8px,transparent .9px);background-size:10px 10px; }
.pattern-chip.pattern-grid::before { background-image:linear-gradient(var(--ui-edge) .7px,transparent .7px),linear-gradient(90deg,var(--ui-edge) .7px,transparent .7px);background-size:16px 16px; }
.pattern-chip.pattern-diagonal::before { background-image:repeating-linear-gradient(135deg,transparent 0 9px,var(--ui-edge) 9px 10px); }
.pattern-chip.pattern-cross::before { background-image:linear-gradient(var(--ui-edge) .8px,transparent .8px),linear-gradient(90deg,var(--ui-edge) .8px,transparent .8px);background-size:22px 22px;background-position:11px 11px; }
.pattern-chip.pattern-waves::before { background-image:radial-gradient(ellipse at center,transparent 62%,var(--ui-edge) 65%,transparent 68%);background-size:24px 10px; }
.pattern-chip.pattern-bricks::before { background-image:linear-gradient(var(--ui-edge) .7px,transparent .7px),linear-gradient(90deg,var(--ui-edge) .7px,transparent .7px);background-size:24px 12px;background-position:0 0,12px 6px; }
.pattern-chip span { position:relative;z-index:1;font:11px var(--mono);padding:2px 5px;border-radius:3px;background:color-mix(in srgb,var(--ui-field) 82%,transparent); }
.pattern-chip.on { box-shadow:inset 0 0 0 3px var(--ui-accent);color:var(--ui-ink); }
.global-settings { min-width:0; }
.font-groups { display:flex;gap:5px;flex-wrap:wrap; }
.font-groups button { display:inline-flex;align-items:center;justify-content:center;min-width:42px;height:42px;padding:4px;border-radius:6px;background:var(--ui-field);box-shadow:inset 0 0 0 1px var(--ui-edge);font-family:var(--mono); }
.font-groups button.on { background:var(--ui-active);color:var(--ui-selected-ink);box-shadow:inset 0 0 0 2px var(--ui-accent); }
.workspace-fonts button:first-child { min-width:92px;font-size:11px!important; }
.weight-groups { display:grid;grid-template-columns:repeat(3,1fr);gap:5px; }
.weight-groups button { height:38px;padding:4px 8px;border-radius:6px;background:var(--ui-field);box-shadow:inset 0 0 0 1px var(--ui-edge); }
.weight-groups button.on { background:var(--ui-active);color:var(--ui-selected-ink);box-shadow:inset 0 0 0 2px var(--ui-accent); }

.panepop[style*="left"] { transform:none;animation:none; }

.pane.focused .pane-edge { box-shadow:inset 0 0 0 3px var(--t-ring); }
</style>

<script>
  try {
    var b = localStorage.getItem('ttyd-workspace-bg');
    if (b) document.documentElement.style.setProperty('--boot-bg', b);
  } catch (e) {}
</script>
