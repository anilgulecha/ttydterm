<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ttydterm</title>

<!--
  ttydterm 1.1 is a terminal workspace for vanilla ttyd.
  build.mjs inlines the styles, React, xterm.js, and the application below.
  Static hosts show monospace terminal documentation. ttyd serves real
  terminals from the same-origin /token and /ws endpoints.
-->

<style>
/*__TTYDTERM_STYLES__*/
</style>

<script>
  try {
    var b = localStorage.getItem('ttyd-workspace-bg');
    if (b) document.documentElement.style.setProperty('--boot-bg', b);
  } catch (e) {}
</script>
</head>
<body>
<div id="root"></div>
<script>
/*__TTYDTERM_APP__*/
</script>
</body>
</html>
